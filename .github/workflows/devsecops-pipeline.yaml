name: Pipeline DevSecOps End-to-End

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # 1. SECRET SCANNING
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. SAST (Análisis Estático del Código de la App)
  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep en app/
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --error app/

  # 3. SCA (Análisis de Dependencias)
  sca:
    name: 3. SCA (Trivy Filesystem)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de librerías con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # 4. IaC SECURITY (Checkov con políticas excluidas)
  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: 'terraform,dockerfile'
          soft_fail: false
          skip_check: 'CKV_AWS_18,CKV_AWS_21,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_260'

  # 5. BUILD, CONTAINER SCAN & GENERACIÓN DE SBOM
  build-and-sbom:
    name: 5. Build, Container Scan & SBOM
    needs: [sast, sca, iac-security]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    # Expone el digest para que el job 6 firme exactamente esta imagen
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      # El checkout deja .trivyignore.yaml disponible en el workspace
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # format=long -> sha-<40 caracteres>.
          # Con el valor por defecto (format=short) el tag es sha-<7 car.>,
          # que era la causa del MANIFEST_UNKNOWN en el job 6.
          # Con firma por digest esto ya no es critico, pero mantiene
          # coherencia entre el tag publicado y github.sha.
          tags: type=sha,format=long

      - name: Compilar Imagen Docker Local
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: 'sbom.cyclonedx.json'

      - name: Publicar SBOM como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      # ---------------------------------------------------------------
      # GATE: bloquea ante CRITICAL, salvo las excepciones documentadas
      # y justificadas en .trivyignore.yaml
      #   - CVE-2023-45853 (zlib1g, will_not_fix, minizip no distribuido)
      #   - CVE-2025-7458  (libsqlite3-0, sin parche en Debian 12)
      # Ambas expiran el 2026-11-01 y volveran a bloquear el build.
      # ---------------------------------------------------------------
      - name: Escaneo de Imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: 'CRITICAL'
          trivyignores: '.trivyignore.yaml'
          exit-code: '1'

      # ---------------------------------------------------------------
      # INVENTARIO: reporta TODO sin excepciones y sin bloquear
      # ---------------------------------------------------------------
      - name: Inventario completo de vulnerabilidades
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'
          output: 'trivy-full-report.txt'

      - name: Publicar inventario como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-full-report
          path: trivy-full-report.txt

      # ---------------------------------------------------------------
      # Publica exactamente la imagen escaneada y captura su digest.
      # RepoDigests solo se rellena DESPUES de un push correcto, por eso
      # el docker inspect va en segundo lugar.
      # ---------------------------------------------------------------
      - name: Publicar Imagen en GHCR
        id: push
        run: |
          docker push "${{ steps.meta.outputs.tags }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${{ steps.meta.outputs.tags }}" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Digest publicado: $DIGEST"

  # 6. FIRMA CRIPTOGRÁFICA DE CONTENEDORES
  sign-container:
    name: 6. Firma de Artefacto (Cosign Keyless)
    needs: build-and-sbom
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Los registros OCI rechazan mayusculas en el nombre del repositorio.
      # metadata-action lo hace automaticamente; aqui hay que hacerlo a mano.
      - name: Normalizar nombre de imagen a minusculas
        id: img
        env:
          FULL_NAME: ${{ env.REGISTRY }}/${{ github.repository }}
        run: echo "name=${FULL_NAME,,}" >> "$GITHUB_OUTPUT"

      # Firma por DIGEST, no por tag:
      #   - elimina el WARNING de cosign (el soporte de tags sera retirado)
      #   - garantiza que se firma exactamente el artefacto escaneado
      #     por Trivy, ya que un tag es un puntero mutable
      - name: Firmar Imagen mediante Sigstore (OIDC Keyless)
        run: |
          IMAGE_REF="${{ steps.img.outputs.name }}@${{ needs.build-and-sbom.outputs.image-digest }}"
          echo "Firmando: $IMAGE_REF"
          cosign sign --yes "$IMAGE_REF"